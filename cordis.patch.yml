# dsh-router-codebuddy bundle patch
#
# Mounts dsh-router-codebuddy into the DSH cordis bundle stack. This plugin
# registers the codebuddy supplier FAMILY (codebuddy + codebuddy-en) into the
# `router.suppliers` cordis service (host half) so dsh-router can load them.
# dsh-router defers via ctx.inject until the service is available, so order vs
# dsh-router doesn't matter.
- insert:
    - id: dsh-router-codebuddy
      name: 'dsh-router-codebuddy'
